<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>10-Week Fresher Roadmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one sticky week-tab bar over a single reading column. Overview and Changes tabs sit at the ends, each week is a stack of collapsible days. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#18202e; --muted:#586376; --line:#dde1e9;
  --accent:#2352c4; --accent-soft:#e6edfb;
  --prog:#2352c4; --dev:#0c7a68; --rev:#a9620c; --test:#7640b0; --brk:#8b94a6;
  --good:#17803d; --warn:#a9620c; --bad:#b42f2f;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e121a; --surface:#151a24; --ink:#e5e9f0; --muted:#9aa5b8; --line:#252c3a;
    --accent:#7b9cf2; --accent-soft:#1b2640;
    --prog:#7b9cf2; --dev:#44c2ab; --rev:#e3a64f; --test:#bb8fe8; --brk:#697386;
    --good:#4cc27a; --warn:#e3a64f; --bad:#ef7b7b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e121a; --surface:#151a24; --ink:#e5e9f0; --muted:#9aa5b8; --line:#252c3a;
  --accent:#7b9cf2; --accent-soft:#1b2640;
  --prog:#7b9cf2; --dev:#44c2ab; --rev:#e3a64f; --test:#bb8fe8; --brk:#697386;
  --good:#4cc27a; --warn:#e3a64f; --bad:#ef7b7b;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto}
.mono{font-family:var(--mono)}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{padding-top:28px;padding-bottom:18px;display:grid;gap:10px}
.eyebrow{font:500 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(26px,5vw,34px);letter-spacing:-.01em}
.lede{color:var(--muted);max-width:64ch}
.overall{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:6px}
.bar{height:8px;background:var(--line);border-radius:2px;overflow:hidden;flex:1 1 200px;min-width:0}
.bar>i{display:block;height:100%;background:var(--accent);width:var(--p,0%)}
.overall .num{font:500 12.5px var(--mono);color:var(--muted)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;gap:4px;overflow-x:auto;padding:8px 0;scrollbar-width:thin}
.tab{flex:0 0 auto;min-width:48px;min-height:44px;padding:6px 10px;border:1px solid transparent;background:transparent;border-radius:4px;cursor:pointer;
  display:grid;gap:5px;justify-items:stretch;text-align:center}
.tab span{font:500 12.5px var(--mono)}
.tab i{display:block;height:3px;background:var(--line);border-radius:1px;position:relative;overflow:hidden}
.tab i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--p,0%);background:var(--accent)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line)}
.tab:hover{background:var(--surface)}
.tab.wide{padding-inline:14px}

main{padding-top:24px;display:grid;gap:28px}
section.panel[hidden]{display:none}
.panel{display:grid;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px}
.card h3{font-size:16px;margin-bottom:6px}
.card .sub{color:var(--muted);font-size:13.5px;margin-bottom:14px;max-width:70ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid2>*{min-width:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font:500 13px var(--mono);text-decoration:underline;text-underline-offset:3px}

.rows{display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:150px 1fr 96px;gap:4px 12px;align-items:center;font-size:13.5px}
.rrow .lab{min-width:0}
.rrow .val{font:12.5px var(--mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{height:10px;background:var(--line);border-radius:2px;overflow:hidden;display:flex;min-width:0}
.meter>i{display:block;height:100%;background:var(--c,var(--accent));width:var(--w,0%)}
.meter>i+i{border-left:1px solid var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:baseline}
.t-prog{--c:var(--prog)} .t-dev{--c:var(--dev)} .t-rev{--c:var(--rev)} .t-test{--c:var(--test)} .t-brk{--c:var(--brk)}
.c-html{--c:var(--prog)} .c-css{--c:var(--dev)} .c-js{--c:var(--rev)} .c-proj{--c:var(--test)}

.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:12px}
.rules b{font-weight:600}
.rules .k{font:500 12px var(--mono);color:var(--muted);padding-top:3px;min-width:22px}
.note{border:1px solid var(--line);background:var(--accent-soft);border-radius:4px;padding:14px 16px;font-size:14px}
.note b{font-weight:600}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px}
ul.plain li{padding-left:2px}

.whead{display:grid;gap:12px}
.whead h2{font-size:clamp(21px,4vw,26px)}
.whead .kicker{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wmeta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.wmeta span{white-space:nowrap}
.mile{max-width:70ch}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status .lbl{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.status label{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;font-size:13.5px}
.status input{accent-color:var(--accent);margin:0}
.status label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.hint{font-size:12.5px;color:var(--muted)}

details.day{background:var(--surface);border:1px solid var(--line);border-radius:4px}
details.day+details.day{margin-top:8px}
details.day>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 16px;min-height:48px}
details.day>summary::-webkit-details-marker{display:none}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-left:2px}
details[open]>summary .chev{transform:rotate(45deg)}
.dname{font-weight:600;min-width:0}
.dname small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.4;overflow-wrap:anywhere}
.dcount{font:500 12.5px var(--mono);color:var(--muted);white-space:nowrap;text-align:right}
.dcount.done{color:var(--good)}
.dbody{padding:0 16px 8px;border-top:1px solid var(--line)}
.block{padding:14px 0;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0}
.bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font:500 12px var(--mono);color:var(--muted)}
.bhead .tn{color:var(--ink)}
.btitle{font-size:15.5px;margin:4px 0 8px}
.block.brk{padding:8px 0}
.block.brk .bhead{font-weight:400}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:4px 24px}
.groups>div{min-width:0}
.gh{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:6px 0 2px}
label.item{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:6px 0;cursor:pointer;align-items:start;overflow-wrap:anywhere}
label.item input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent)}
label.item:has(input:checked) span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.selfcheck{display:grid;gap:2px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.cutgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.cutgrid>*{min-width:0}
.cutgrid h4{font:500 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

@media (max-width:560px){
  .rrow{grid-template-columns:1fr auto}
  .rrow .meter{grid-column:1 / -1;order:3}
  .card{padding:14px}
  details.day>summary{padding:10px 12px}
  .dbody{padding-inline:12px}
}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

function buildDays(w){
  const days=[];
  for(let d=0;d<7;d++){
    const blocks=[];
    const add=(track,mins,title,groups,cat)=>blocks.push({track,mins,title,groups:groups||[],cat});
    if(d<5){
      const fri=d===4;
      if(w.n===1&&d===0){
        add("rev",10,"Setup check",[{h:"Check",items:["VS Code, a C++ compiler (g++) and Chrome are installed and working","A folder for the course is open in VS Code"]}]);
      }else{
        const prev=d>0?{p:w.prog[d-1],v:w.dev[d-1]}:{p:WEEKS[w.n-2].prog[4],v:WEEKS[w.n-2].dev[4]};
        add("rev",fri?15:10,"Recall from last session",[{h:"No notes",items:["Retype from memory: "+prev.p.focus,"Explain aloud in one minute: "+prev.v.focus]}]);
      }
      add("prog",fri?75:65,w.prog[d].focus,[{h:"Learn",items:w.prog[d].learn},{h:"Practice",items:w.prog[d].practice}]);
      add("brk",fri?10:5,"Break");
      add("dev",fri?75:65,w.dev[d].focus,[{h:"Learn",items:w.dev[d].learn},{h:"Practice",items:w.dev[d].practice}],w.dev[d].cat);
      if(fri)add("dev",30,"Apply and combine",[{h:"Build",items:w.apply}],w.dev[4].cat);
      add("rev",5,"Wrap-up log",[{h:"Log",items:["Write one thing you learned and one thing still unclear"]}]);
    }else if(d===5){
      const s=Object.assign({test:45,project:75,prog:75},w.sat||{});
      const tg=[{h:"Programming",items:w.satTest.prog},{h:"Development",items:w.satTest.dev}];
      if(w.n>=3)tg.push({h:"Retention check, D14",items:["Answer 5 questions from Week "+(w.n-2)+" without notes"]});
      add("test",s.test,"Weekly test, closed book",tg);
      add("brk",10,"Break");
      add("dev",s.project,"Weekly build",[{h:"Build",items:w.project}],w.satCat);
      add("brk",10,"Break");
      add("prog",s.prog,"Problem set",[{h:"Solve",items:w.progSet}]);
      add("rev",20,"Review mistakes",[{h:"Review",items:["Label each wrong answer: concept gap, syntax slip or careless","Write the corrected solution beside it","Set this week's Green, Yellow or Red status below"]}]);
      add("rev",5,"Wrap-up log",[{h:"Log",items:["Write one thing you learned and one thing still unclear"]}]);
    }else{
      add("rev",30,"Weekly revision, D7",[{h:"Revisit",items:["Programming: "+w.prog.map(x=>x.focus).join(" / "),"Development: "+w.dev.map(x=>x.focus).join(" / ")]}]);
      add("prog",60,"Debug and consolidation",[{h:"Fix",items:w.fix}]);
      add("brk",10,"Break");
      add("dev",50,"Free build and catch-up",[{h:"Build",items:w.free}],w.sunCat);
      add("rev",25,"Plan next week",[{h:"Plan",items:["Complete the self-check list below","Write the 3 topics to revisit first next week"]}]);
      add("rev",5,"Wrap-up log",[{h:"Log",items:["Write one thing you learned and one thing still unclear"]}]);
    }
    days.push({d,blocks,mins:blocks.reduce((a,b)=>a+b.mins,0)});
  }
  return days;
}
const WK=WEEKS.map(w=>({w,days:buildDays(w)}));
function tally(days){
  const t={prog:0,dev:0,rev:0,test:0,brk:0},c={html:0,css:0,js:0,proj:0};
  days.forEach(d=>d.blocks.forEach(b=>{t[b.track]+=b.mins;if(b.track==="dev")c[b.cat]+=b.mins;}));
  return{t,c};
}

function dayHTML(w,day){
  let t=0;
  const body=day.blocks.map((b,bi)=>{const h=blockHTML(w,day.d,bi,b,t);t+=b.mins;return h;}).join("");
  const sub=day.d<5?w.prog[day.d].focus+" / "+w.dev[day.d].focus:(day.d===5?"Weekly test, build and problem set":"Revision, debugging and catch-up");
  return '<details class="day" data-day="'+day.d+'"><summary><span class="chev"></span><span class="dname">'+DAYN[day.d]+'<small>'+esc(sub)+'</small></span><span class="dcount"><span class="dc"></span> &middot; '+hrs(day.mins)+'</span></summary><div class="dbody">'+body+'</div></details>';
}
function weekHTML(o){
  const w=o.w,tl=total[w.n-1];
  const dm=tl.t.prog+tl.t.dev+tl.t.rev+tl.t.test+tl.t.brk;
  const scid=n=>"w"+w.n+".sc."+n;
  const stat=[["g","Green","Completes about 80 percent independently"],["y","Yellow","Understands but needs hints"],["r","Red","Cannot solve basics without copying"]];
  const sHTML=stat.map(s=>'<label title="'+s[2]+'"><input type="radio" name="st'+w.n+'" value="'+s[0]+'"'+(S.status["w"+w.n]===s[0]?" checked":"")+'>'+s[1]+'</label>').join("");
  return '<section class="panel" id="p-w'+w.n+'" data-week="'+w.n+'" hidden>'+
   '<div class="whead"><div class="kicker">Week '+w.n+' of 10</div><h2>'+esc(w.title)+'</h2>'+
   '<p class="mile">'+esc(w.milestone)+'</p>'+
   '<div class="wmeta"><span>'+hrs(dm)+' this week</span><span>Programming '+hrs(tl.t.prog)+'</span><span>Development '+hrs(tl.t.dev)+'</span><span>Revision '+hrs(tl.t.rev)+'</span><span>Tests '+hrs(tl.t.test)+'</span></div>'+
   '<div class="overall"><div class="bar wbar" role="progressbar" aria-label="Week '+w.n+' progress" aria-valuemin="0" aria-valuemax="100"><i></i></div><span class="num wnum"></span></div></div>'+
   '<div>'+o.days.map(dy=>dayHTML(w,dy)).join("")+'</div>'+
   '<div class="card"><h3>Week '+w.n+' self-check</h3><p class="sub">Tick only what you can do without notes or help.</p><div class="selfcheck">'+w.selfCheck.map((t,i)=>itemHTML(scid(i),t)).join("")+'</div>'+
   '<div class="status" style="margin-top:14px"><span class="lbl">Status</span>'+sHTML+'</div>'+
   '<p class="hint" style="margin-top:8px">Red and Yellow topics become the first thing revised next week. Nobody moves on at the same pace by default.</p></div>'+
   '<div class="pager">'+(w.n>1?'<button class="btn" data-go="w'+(w.n-1)+'">Week '+(w.n-1)+'</button>':'<button class="btn" data-go="overview">Overview</button>')+(w.n<10?'<button class="btn" data-go="w'+(w.n+1)+'">Week '+(w.n+1)+'</button>':'<button class="btn" data-go="changes">What changed</button>')+'</div>'+
  '</section>';
}

function meterRow(label,mins,max,cls,val){
  return '<div class="rrow"><span class="lab"><i class="dot '+cls+'"></i>'+esc(label)+'</span><div class="meter '+cls+'"><i style="--w:'+(mins/max*100).toFixed(1)+'%"></i></div><span class="val">'+val+'</span></div>';
}
function overviewHTML(){
  const trackRows=["prog","dev","rev","test","brk"].map(k=>meterRow(TN[k],sumT[k],allMin,"t-"+k,hrs(sumT[k])+" / "+Math.round(sumT[k]/allMin*100)+"%")).join("");
  const devMin=sumT.dev;
  const catRows=["html","css","js","proj"].map(k=>meterRow(CN[k],sumC[k],devMin,"c-"+k,hrs(sumC[k])+" / "+Math.round(sumC[k]/devMin*100)+"%")).join("");
  const maxWeek=Math.max.apply(null,total.map(x=>x.t.prog+x.t.dev+x.t.rev+x.t.test+x.t.brk));
  const weekRows=WK.map((o,i)=>{
    const t=total[i].t,sum=t.prog+t.dev+t.rev+t.test+t.brk;
    const seg=["prog","dev","rev","test","brk"].map(k=>'<i class="t-'+k+'" style="--c:var(--'+k+');--w:'+(t[k]/maxWeek*100).toFixed(2)+'%" title="'+TN[k]+' '+hrs(t[k])+'"></i>').join("");
    return '<div class="rrow"><span class="lab"><button class="linkbtn" data-go="w'+o.w.n+'">Week '+o.w.n+'</button></span><div class="meter">'+seg+'</div><span class="val">'+hrs(sum)+'</span></div>';
  }).join("");
  const legend=["prog","dev","rev","test","brk"].map(k=>'<span><i class="dot t-'+k+'"></i>'+TN[k]+'</span>').join("");
  const map=WK.map(o=>'<tr><td><button class="linkbtn" data-go="w'+o.w.n+'">W'+o.w.n+'</button></td><td>'+esc(o.w.progTheme)+'</td><td>'+esc(o.w.devTheme)+'</td><td>'+esc(o.w.mapOut)+'</td></tr>').join("");
  return '<section class="panel" id="p-overview" hidden>'+
  '<div class="card"><h3>Week map</h3><p class="sub">Programming and development run side by side every day. C++ carries DSA; Java arrives in Week 6 by porting what learners already solved.</p><div class="scroll"><table><thead><tr><th></th><th>Programming and DSA</th><th>Development</th><th>Output</th></tr></thead><tbody>'+map+'</tbody></table></div></div>'+
  '<div class="grid2"><div class="card"><h3>Daily schedule</h3><p class="sub">Minutes include breaks. Programming comes first because it needs the most focus; the visual, instantly checkable dev block follows.</p><div class="scroll"><table><thead><tr><th>Day</th><th class="n">Total</th><th>Shape</th></tr></thead><tbody>'+
   '<tr><td>Mon to Thu</td><td class="n">2 h 30</td><td>Recall 10, programming 65, break 5, dev 65, log 5</td></tr>'+
   '<tr><td>Friday</td><td class="n">3 h 30</td><td>Recall 15, programming 75, break 10, dev 75, apply and combine 30, log 5</td></tr>'+
   '<tr><td>Saturday</td><td class="n">4 h</td><td>Test 45, build 75, problem set 75, mistake review 20, breaks 20, log 5</td></tr>'+
   '<tr><td>Sunday</td><td class="n">3 h</td><td>Weekly revision 30, debug day 60, free build 50, plan 25, break 10, log 5</td></tr>'+
  '</tbody></table></div></div>'+
  '<div class="card"><h3>Flow-state rules</h3><p class="sub">The structure exists to protect attention.</p><ul class="rules">'+
   '<li><span class="k">01</span><span><b>One goal per block.</b> Each block names one concept and ends with something that runs.</span></li>'+
   '<li><span class="k">02</span><span><b>Challenge ramps up.</b> Practice lists run from easy to hard. The last item is the stretch; drop it if the block runs late.</span></li>'+
   '<li><span class="k">03</span><span><b>Fast feedback.</b> Run the code or refresh the browser after every small change.</span></li>'+
   '<li><span class="k">04</span><span><b>Think, then build.</b> Logic-heavy programming first, visual work second.</span></li>'+
   '<li><span class="k">05</span><span><b>Fixed breaks.</b> Stand up and step away from the screen. Do not merge blocks to save time.</span></li>'+
   '<li><span class="k">06</span><span><b>Close the loop.</b> The 5-minute log feeds Sunday.</span></li></ul></div></div>'+
  '<div class="card"><h3>Hours across the 10 weeks</h3><p class="sub">'+hrs(allMin)+' in total, counted from the daily plans below.</p>'+
   '<div class="grid2"><div><div class="gh" style="margin-bottom:10px">By track</div><div class="rows">'+trackRows+'</div></div>'+
   '<div><div class="gh" style="margin-bottom:10px">Development split</div><div class="rows">'+catRows+'</div><p class="hint" style="margin-top:12px">HTML finishes in Week 2, CSS in Week 4, JavaScript runs Weeks 5 to 8, and the capstone uses all three in Weeks 9 and 10.</p></div></div></div>'+
  '<div class="card"><h3>Hours per week</h3><div class="legend">'+legend+'</div><div class="rows">'+weekRows+'</div><p class="hint" style="margin-top:12px">Week 10 trades build and problem-set time for the final test and demo.</p></div>'+
  '<div class="card"><h3>Revision system</h3><p class="sub">Spaced revision is built into the week instead of saved for the end.</p><div class="scroll"><table><thead><tr><th>Stage</th><th>Where it happens</th></tr></thead><tbody>'+
   '<tr><td>D0 learn</td><td>The programming or development block</td></tr>'+
   '<tr><td>D1 recall</td><td>First 10 to 15 minutes of every weekday, no notes</td></tr>'+
   '<tr><td>D3 practice</td><td>Friday apply block and Saturday problem set reuse Monday to Wednesday topics</td></tr>'+
   '<tr><td>D7 revision</td><td>Sunday weekly revision and debug day</td></tr>'+
   '<tr><td>D14 retention</td><td>Saturday test includes 5 closed-book questions from two weeks earlier</td></tr>'+
  '</tbody></table></div></div>'+
  '<div class="note"><b>Honest outlook.</b> This is a full load for freshers. Realistic results after 10 weeks: solid HTML and CSS, JavaScript good enough to build small DOM apps and call an API, C++ comfortable for DSA, Java at a working level reached by porting, and about 50 to 70 DSA problems solved. Weeks 5 to 8 are the hardest because each adds new ideas on both tracks. If a third of the batch is Red at the end of Week 5, use that Saturday and Sunday for catch-up and shrink the Week 9 capstone instead of stretching the programme.</div>'+
  '<div class="card"><h3>Progress</h3><p class="sub">Checkmarks are saved in this browser only.</p><button class="btn danger" id="resetBtn">Reset all progress</button></div>'+
  '</section>';
}
function changesHTML(){
  const cut=[
   ["HTML",["Memorising tag lists and obsolete tags such as font and center","Tables used for layout","Comments as a separate topic"]],
   ["CSS",["Floats for layout, replaced by Flexbox and Grid","Vendor prefixes","Keyframe animation deep dives; transitions stay","Bootstrap, Tailwind and Sass, better after the programme"]],
   ["JavaScript",["var hoisting and the prototype chain","this deep dive and call, apply, bind","Regular expressions","JS classes, since OOP is learned in C++ and Java","ES modules and bundlers","jQuery"]],
   ["C++",["Operator overloading, templates and file handling","Macros and preprocessor tricks","Friend functions and virtual inheritance","Bit manipulation","Smart pointers"]],
   ["Java",["Generics beyond reading List of String","Threads and concurrency","Streams and lambdas","Inner classes","File I/O and frameworks"]],
   ["DSA",["Heaps, graphs, dynamic programming, AVL and segment trees","Re-implementing every sort again and again","Memorising operator precedence"]]
  ];
  const cutHTML=cut.map(c=>'<div><h4>'+c[0]+'</h4><ul class="plain">'+c[1].map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>').join("");
  return '<section class="panel" id="p-changes" hidden>'+
  '<div class="card"><h3>What changed from the earlier plan</h3><p class="sub">The structure is the same: HTML before CSS before JS, language basics before OOP before DSA, a weekly test and a revision system.</p><ul class="plain">'+
   '<li>Daily time is now 2.5 hours Monday to Thursday, with 3.5, 4 and 3 hours on Friday, Saturday and Sunday. Each weekday is two 65-minute blocks instead of long lectures.</li>'+
   '<li>Java is added. C++ stays the main language for DSA. Java starts in Week 6 by porting solved problems, then gets its own OOP and collections work in Week 7.</li>'+
   '<li>HTML and CSS are complete by Week 4. JavaScript covers syntax, DOM, events, ES6, localStorage and fetch. A small capstone fills Weeks 9 and 10.</li>'+
   '<li>Each Sunday is a debug and consolidation day, and each Saturday ends with a status check of Green, Yellow or Red.</li>'+
   '<li>STL is kept to vector and string until Week 3, and the heavier OOP and DSA topics start only after pointers and recursion are in place.</li></ul></div>'+
  '<div class="card"><h3>Cut or shortened</h3><p class="sub">Removed because they cost time without helping a fresher build, solve or get hired in this window. Do-while, switch, bubble sort and merge sort stay but are kept short.</p><div class="cutgrid">'+cutHTML+'</div></div>'+
  '</section>';
}

let panels="";
panels+=overviewHTML();
WK.forEach(o=>panels+=weekHTML(o));
panels+=changesHTML();
$("#main").innerHTML=panels;

const tabIds=["overview"].concat(WK.map(o=>"w"+o.w.n),["changes"]);
$("#tabs").innerHTML=tabIds.map(id=>{
  const lab=id==="overview"?"Overview":id==="changes"?"Changes":"W"+id.slice(1);
  return '<button class="tab'+(id==="overview"||id==="changes"?" wide":"")+'" role="tab" data-go="'+id+'" aria-selected="false"><span>'+lab+'</span>'+(id[0]==="w"?'<i></i>':"")+'</button>';
}).join("");
$("#eyebrow").textContent="Fresher programme / 10 weeks / "+hrs(allMin);

function refresh(){
  let all=0,done=0;
  $$("section[data-week]").forEach(p=>{
    const n=p.dataset.week;
    const tasks=$$("input.task",p);
    const dn=tasks.filter(x=>x.checked).length;
    all+=tasks.length;done+=dn;
    const pct=tasks.length?Math.round(dn/tasks.length*100):0;
    $(".wbar",p).setAttribute("aria-valuenow",pct);
    $(".wbar i",p).style.setProperty("--p",pct+"%");
    $(".wnum",p).textContent=dn+" of "+tasks.length+" tasks";
    const tab=$('.tab[data-go="w'+n+'"] i');
    if(tab)tab.style.setProperty("--p",pct+"%");
    $$("details.day",p).forEach(dy=>{
      const t=$$("input.task",dy),c=t.filter(x=>x.checked).length;
      const el=$(".dc",dy);el.textContent=c+"/"+t.length;
      $(".dcount",dy).classList.toggle("done",t.length>0&&c===t.length);
    });
  });
  const pct=all?Math.round(done/all*100):0;
  $("#overallBar").setAttribute("aria-valuenow",pct);
  $("#overallBar i").style.setProperty("--p",pct+"%");
  $("#overallNum").textContent=done+" of "+all+" tasks ("+pct+"%)";
}
function openFirstIncomplete(p){
  const ds=$$("details.day",p);
  if(ds.some(x=>x.open))return;
  const t=ds.find(x=>$$("input.task",x).some(i=>!i.checked))||ds[0];
  if(t)t.open=true;
}
function show(id,scroll){
  if(!tabIds.includes(id))id="overview";
  $$("section.panel").forEach(p=>p.hidden=p.id!=="p-"+id);
  $$(".tab").forEach(t=>{const on=t.dataset.go===id;t.setAttribute("aria-selected",on);if(on)t.scrollIntoView({inline:"center",block:"nearest"});});
  const p=$("#p-"+id);
  if(id[0]==="w"&&id!=="overview")openFirstIncomplete(p);
  S.tab=id;save();
  try{if(location.hash.slice(1)!==id)history.replaceState(null,"","#"+id);}catch(e){}
  if(scroll){const top=$("#tabs").getBoundingClientRect().top+window.scrollY-(parseInt(getComputedStyle(document.documentElement).paddingTop)||0);
    window.scrollTo({top:Math.max(0,top),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){show(g.dataset.go,true);}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("task")){
    if(t.checked)S.checked[t.id]=1;else delete S.checked[t.id];
    save();refresh();
  }else if(t.type==="radio"&&t.name&&t.name.indexOf("st")===0){
    S.status["w"+t.name.slice(2)]=t.value;save();
  }
});
let rt;
$("#resetBtn").addEventListener("click",function(){
  const b=this;
  if(b.dataset.arm){
    S.checked={};S.status={};save();
    $$("input.task").forEach(x=>x.checked=false);
    $$('input[type="radio"]').forEach(x=>x.checked=false);
    delete b.dataset.arm;b.textContent="Reset all progress";clearTimeout(rt);refresh();
  }else{
    b.dataset.arm="1";b.textContent="Click again to confirm";
    rt=setTimeout(()=>{delete b.dataset.arm;b.textContent="Reset all progress";},4000);
  }
});
window.addEventListener("hashchange",()=>show(location.hash.slice(1),false));
refresh();
const startTab=(location.hash&&location.hash.slice(1))||S.tab||"overview";
show(startTab,false);
</script>

</body></html>
